<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Basketball Pro Coach</title>
    <meta name="description" content="Tactics board, stat tracker, practice planner and attendance for basketball coaches." />

    <!-- Open Graph / Twitter preview card — without these, sharing the link
         in a chat app or on social media shows a bare URL instead of the
         app's name, description and icon. icon-512.png stands in for a
         dedicated 1200x630 banner for now (square images still render fine
         on every major platform, just smaller/centered). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://basketballprocoach.com/" />
    <meta property="og:title" content="Basketball Pro Coach" />
    <meta property="og:description" content="Tactics board, stat tracker, practice planner and attendance for basketball coaches." />
    <meta property="og:image" content="https://basketballprocoach.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Basketball Pro Coach" />
    <meta name="twitter:description" content="Tactics board, stat tracker, practice planner and attendance for basketball coaches." />
    <meta name="twitter:image" content="https://basketballprocoach.com/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
